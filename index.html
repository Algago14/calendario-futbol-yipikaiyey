<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendario de fútbol</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            margin: 0;
            color: #1f2937;
        }

        header {
            background: #111827;
            color: white;
            text-align: center;
            padding: 30px 20px;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
        }

        header p {
            margin: 8px 0 0;
            opacity: 0.8;
        }

        main {
            max-width: 700px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .partido {
            background: white;
            border-radius: 16px;
            padding: 22px;
            margin-bottom: 20px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .jornada {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 10px;
        }

        .equipos {
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            margin: 15px 0;
        }

        .datos {
            text-align: center;
            line-height: 1.8;
            color: #4b5563;
        }

        .boton {
            display: block;
            width: 100%;
            margin-top: 18px;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: #111827;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<header>
    <h1>⚽ CALENDARIO DE FÚTBOL</h1>
    <p>Temporada 2026/2027</p>
</header>

<main>

    <div class="partido">
        <div class="jornada">Jornada 1</div>

        <div class="equipos">
            Equipo Local 🆚 Equipo Visitante
        </div>

        <div class="datos">
            📅 Domingo, 18 de octubre<br>
            🕘 20:30<br>
            📍 Campo Municipal
        </div>

        <button class="boton">
            ¿Puedes jugar?
        </button>
    </div>

</main>

</body>
</html>

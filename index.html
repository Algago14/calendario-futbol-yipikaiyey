/* =========================================================
   CARGAR PARTIDOS
   ========================================================= */

async function cargarPartidos() {

    const lista =
        document.getElementById("lista-partidos");


    /* Obtener partidos */

    const { data: partidos, error } =
        await supabaseClient

            .from("partidos")

            .select("*")

            .order("fecha", {
                ascending: true
            })

            .order("hora", {
                ascending: true
            });


    if (error) {

        console.error(error);

        lista.innerHTML = `
            <p style="text-align:center;">
                No se han podido cargar los partidos.
            </p>
        `;

        return;
    }


    if (!partidos || partidos.length === 0) {

        lista.innerHTML = `
            <p style="text-align:center;">
                No hay partidos programados.
            </p>
        `;

        return;
    }


    /* Obtener todas las disponibilidades */

    const {
        data: disponibilidades,
        error: errorDisponibilidad
    } = await supabaseClient

        .from("disponibilidad")

        .select(`
            partido_id,
            jugador_id,
            estado,
            jugadores (
                nombre
            )
        `);


    if (errorDisponibilidad) {

        console.error(errorDisponibilidad);

    }


    const respuestas =
        disponibilidades || [];


    lista.innerHTML = "";


    /* Crear cada partido */

    partidos.forEach((partido, indice) => {


        const fecha =
            new Date(
                partido.fecha + "T00:00:00"
            );


        const fechaFormateada =
            fecha.toLocaleDateString(
                "es-ES",
                {
                    weekday: "long",
                    day: "numeric",
                    month: "long"
                }
            );


        /* Filtrar respuestas de este partido */

        const respuestasPartido =
            respuestas.filter(
                respuesta =>
                    respuesta.partido_id === partido.id
            );


        /* Separar por estado */

        const disponibles =
            respuestasPartido.filter(
                respuesta =>
                    respuesta.estado === "si"
            );


        const noDisponibles =
            respuestasPartido.filter(
                respuesta =>
                    respuesta.estado === "no"
            );


        const dudas =
            respuestasPartido.filter(
                respuesta =>
                    respuesta.estado === "duda"
            );


        /* Obtener nombres */

        const nombresSi =
            disponibles
                .map(
                    respuesta =>
                        respuesta.jugadores?.nombre
                )
                .filter(Boolean);


        const nombresNo =
            noDisponibles
                .map(
                    respuesta =>
                        respuesta.jugadores?.nombre
                )
                .filter(Boolean);


        const nombresDuda =
            dudas
                .map(
                    respuesta =>
                        respuesta.jugadores?.nombre
                )
                .filter(Boolean);


        /* Crear tarjeta */

        const tarjeta =
            document.createElement("div");


        tarjeta.className = "partido";


        tarjeta.innerHTML = `

            <div class="jornada">
                Jornada ${indice + 1}
            </div>


            <div class="equipos">
                ${partido.local} 🆚 ${partido.visitante}
            </div>

            ${
                partido.goles_local !== null &&
                partido.goles_local !== undefined &&
                partido.goles_visitante !== null &&
                partido.goles_visitante !== undefined
                    ? `
                        <div class="resultado">
                            <span class="resultado-label">Resultado</span>
                            ${partido.goles_local} - ${partido.goles_visitante}
                        </div>
                    `
                    : ""
            }


            <div class="datos">

                📅 ${fechaFormateada}<br>

                🕘 ${partido.hora.slice(0, 5)}<br>

                📍 ${partido.campo || "Campo por confirmar"}

            </div>


            <div class="disponibilidad">


                <div class="estado">

                    <div class="estado-titulo">

                        🟢 Sí:
                        ${nombresSi.length}

                    </div>

                    <div class="nombres">

                        ${
                            nombresSi.length
                                ? nombresSi.join(", ")
                                : "Nadie ha confirmado todavía"
                        }

                    </div>

                </div>


                <div class="estado">

                    <div class="estado-titulo">

                        🔴 No:
                        ${nombresNo.length}

                    </div>

                    <div class="nombres">

                        ${
                            nombresNo.length
                                ? nombresNo.join(", ")
                                : "Nadie ha indicado que no pueda"
                        }

                    </div>

                </div>


                <div class="estado">

                    <div class="estado-titulo">

                        🟡 Duda:
                        ${nombresDuda.length}

                    </div>

                    <div class="nombres">

                        ${
                            nombresDuda.length
                                ? nombresDuda.join(", ")
                                : "Nadie tiene dudas"
                        }

                    </div>

                </div>


            </div>


            <button
                class="boton"
                onclick="mostrarDisponibilidad(${partido.id})"
            >

                ¿Puedes jugar?

            </button>

            <button
                class="boton-secundario"
                onclick="mostrarResultado(${partido.id})"
            >

                ⚽ Resultado y goleadores

            </button>

        `;


        lista.appendChild(tarjeta);

    });

    await mostrarClasificacionGoleadores();

}

/* =========================================================
   GUARDAR / ACTUALIZAR DISPONIBILIDAD
   ========================================================= */

async function guardarDisponibilidad(
    partidoId,
    jugadorId,
    estado
) {


    const {
        error
    } = await supabaseClient

        .from("disponibilidad")

        .upsert(

            {
                partido_id: partidoId,

                jugador_id: jugadorId,

                estado: estado,

                actualizado_en:
                    new Date().toISOString()
            },

            {
                onConflict:
                    "partido_id,jugador_id"
            }

        );


    if (error) {

        console.error(error);

        alert(
            "No se ha podido guardar tu respuesta."
        );

        return false;
    }


    return true;

}




/* =========================================================
   RESULTADO Y GOLEADORES
   ========================================================= */

async function mostrarResultado(partidoId) {

    const { data: partido, error: errorPartido } =
        await supabaseClient
            .from("partidos")
            .select("*")
            .eq("id", partidoId)
            .single();

    if (errorPartido) {
        console.error(errorPartido);
        alert("No se ha podido cargar el partido.");
        return;
    }

    const { data: jugadores, error: errorJugadores } =
        await supabaseClient
            .from("jugadores")
            .select("id, nombre")
            .order("nombre", { ascending: true });

    if (errorJugadores) {
        console.error(errorJugadores);
        alert("No se han podido cargar los jugadores.");
        return;
    }

    if (!jugadores || jugadores.length === 0) {
        alert("Todavía no hay jugadores registrados.");
        return;
    }

    const { data: golesExistentes, error: errorGoles } =
        await supabaseClient
            .from("goles")
            .select("jugador_id, cantidad")
            .eq("partido_id", partidoId);

    if (errorGoles) {
        console.error(errorGoles);
        alert("No se han podido cargar los goleadores.");
        return;
    }

    const cantidades = {};
    (golesExistentes || []).forEach(gol => {
        cantidades[gol.jugador_id] = gol.cantidad;
    });

    const listaJugadores = jugadores.map(jugador => `
        <div class="contador-gol">
            <div class="contador-gol-nombre">${jugador.nombre}</div>
            <div class="contador-gol-controles">
                <button type="button" onclick="cambiarGoles(${jugador.id}, -1)">−</button>
                <span class="contador-gol-numero" id="goles-jugador-${jugador.id}">
                    ${cantidades[jugador.id] || 0}
                </span>
                <button type="button" onclick="cambiarGoles(${jugador.id}, 1)">+</button>
            </div>
        </div>
    `).join("");

    const ventana = document.createElement("div");

    ventana.innerHTML = `
        <div style="
            position:fixed; inset:0; background:rgba(0,0,0,0.5);
            display:flex; align-items:center; justify-content:center;
            padding:20px; z-index:9999;
        ">
            <div class="modal-contenido" style="
                background:white; width:100%; max-width:480px;
                border-radius:16px; padding:25px; box-sizing:border-box;
            ">
                <h2 style="margin-top:0;text-align:center;">
                    ⚽ Resultado y goleadores
                </h2>

                <p style="text-align:center;color:#6b7280;margin-top:0;">
                    ${partido.local} - ${partido.visitante}
                </p>

                <div class="resultado-inputs">
                    <div>
                        <div style="font-size:12px;color:#6b7280;text-align:center;margin-bottom:5px;">
                            ${partido.local}
                        </div>
                        <input id="goles-local" class="campo-resultado" type="number" min="0"
                            value="${partido.goles_local !== null && partido.goles_local !== undefined ? partido.goles_local : ""}">
                    </div>

                    <span>-</span>

                    <div>
                        <div style="font-size:12px;color:#6b7280;text-align:center;margin-bottom:5px;">
                            ${partido.visitante}
                        </div>
                        <input id="goles-visitante" class="campo-resultado" type="number" min="0"
                            value="${partido.goles_visitante !== null && partido.goles_visitante !== undefined ? partido.goles_visitante : ""}">
                    </div>
                </div>

                <h3 style="margin-bottom:5px;">Goleadores de YIPIKAIYEY</h3>

                <p style="margin-top:0;color:#6b7280;font-size:13px;">
                    Usa + y − para indicar cuántos goles ha marcado cada jugador.
                </p>

                <div>${listaJugadores}</div>

                <button class="boton" onclick="guardarResultado(${partidoId})">
                    💾 Guardar resultado
                </button>

                <button id="cerrar-resultado" style="
                    width:100%; margin-top:8px; padding:10px; border:none;
                    background:transparent; color:#6b7280; cursor:pointer;
                ">
                    Cancelar
                </button>
            </div>
        </div>
    `;

    document.body.appendChild(ventana);

    document.getElementById("cerrar-resultado").onclick = () => ventana.remove();
}


function cambiarGoles(jugadorId, cambio) {

    const elemento = document.getElementById(`goles-jugador-${jugadorId}`);
    if (!elemento) return;

    let cantidad = parseInt(elemento.textContent, 10) || 0;
    cantidad += cambio;

    if (cantidad < 0) cantidad = 0;

    elemento.textContent = cantidad;
}


async function guardarResultado(partidoId) {

    const golesLocal = parseInt(document.getElementById("goles-local").value, 10);
    const golesVisitante = parseInt(document.getElementById("goles-visitante").value, 10);

    if (
        Number.isNaN(golesLocal) ||
        Number.isNaN(golesVisitante) ||
        golesLocal < 0 ||
        golesVisitante < 0
    ) {
        alert("Introduce un resultado válido.");
        return;
    }

    const { data: partido, error: errorPartido } =
        await supabaseClient
            .from("partidos")
            .select("local, visitante")
            .eq("id", partidoId)
            .single();

    if (errorPartido) {
        console.error(errorPartido);
        alert("No se ha podido comprobar el partido.");
        return;
    }

    const elementos = document.querySelectorAll(".contador-gol-numero");
    let totalGoleadores = 0;
    const golesJugadores = [];

    elementos.forEach(elemento => {

        const jugadorId = elemento.id.replace("goles-jugador-", "");
        const cantidad = parseInt(elemento.textContent, 10) || 0;

        if (cantidad > 0) {
            totalGoleadores += cantidad;
            golesJugadores.push({
                jugador_id: parseInt(jugadorId, 10),
                cantidad: cantidad
            });
        }
    });

    const localEsYipikayey =
        partido.local.toUpperCase().includes("YIPIKAIYEY");

    const visitanteEsYipikayey =
        partido.visitante.toUpperCase().includes("YIPIKAIYEY");

    if (localEsYipikayey && totalGoleadores !== golesLocal) {
        alert(
            `Los goles de los jugadores (${totalGoleadores}) ` +
            `no coinciden con los goles de YIPIKAIYEY (${golesLocal}).`
        );
        return;
    }

    if (visitanteEsYipikayey && totalGoleadores !== golesVisitante) {
        alert(
            `Los goles de los jugadores (${totalGoleadores}) ` +
            `no coinciden con los goles de YIPIKAIYEY (${golesVisitante}).`
        );
        return;
    }

    const { error: errorResultado } =
        await supabaseClient
            .from("partidos")
            .update({
                goles_local: golesLocal,
                goles_visitante: golesVisitante
            })
            .eq("id", partidoId);

    if (errorResultado) {
        console.error(errorResultado);
        alert("No se ha podido guardar el resultado.");
        return;
    }

    const { error: errorBorrado } =
        await supabaseClient
            .from("goles")
            .delete()
            .eq("partido_id", partidoId);

    if (errorBorrado) {
        console.error(errorBorrado);
        alert("El resultado se guardó, pero no se pudieron actualizar los goleadores.");
        return;
    }

    if (golesJugadores.length > 0) {

        const registros = golesJugadores.map(gol => ({
            partido_id: partidoId,
            jugador_id: gol.jugador_id,
            cantidad: gol.cantidad
        }));

        const { error: errorInsert } =
            await supabaseClient
                .from("goles")
                .insert(registros);

        if (errorInsert) {
            console.error(errorInsert);
            alert("El resultado se guardó, pero hubo un error al guardar los goleadores.");
            return;
        }
    }

    const modalResultado = document.getElementById("cerrar-resultado");
    if (modalResultado) {
        modalResultado.closest("div[style*='position:fixed']").parentElement.remove();
    }

    await cargarPartidos();
}


async function mostrarClasificacionGoleadores() {

    const lista = document.getElementById("lista-partidos");

    const { data: goles, error } =
        await supabaseClient
            .from("goles")
            .select(`
                jugador_id,
                cantidad,
                jugadores (
                    nombre
                )
            `);

    if (error) {
        console.error(error);
        return;
    }

    const acumulados = {};

    (goles || []).forEach(gol => {

        if (!acumulados[gol.jugador_id]) {
            acumulados[gol.jugador_id] = {
                nombre: gol.jugadores?.nombre || "Jugador",
                goles: 0
            };
        }

        acumulados[gol.jugador_id].goles += gol.cantidad;
    });

    const clasificacion = Object.values(acumulados).sort((a, b) => {

        if (b.goles !== a.goles) {
            return b.goles - a.goles;
        }

        return a.nombre.localeCompare(b.nombre, "es");
    });

    const bloque = document.createElement("div");
    bloque.className = "goleadores";

    if (clasificacion.length === 0) {

        bloque.innerHTML = `
            <h2>🏆 Clasificación de goleadores</h2>
            <p class="sin-goleadores">
                Todavía no hay goles registrados.
            </p>
        `;

    } else {

        const filas = clasificacion.map((jugador, indice) => {

            let posicion = `${indice + 1}º`;

            if (indice === 0) posicion = "🥇";
            if (indice === 1) posicion = "🥈";
            if (indice === 2) posicion = "🥉";

            return `
                <tr>
                    <td>${posicion}</td>
                    <td>${jugador.nombre}</td>
                    <td>${jugador.goles}</td>
                </tr>
            `;
        }).join("");

        bloque.innerHTML = `
            <h2>🏆 Clasificación de goleadores</h2>

            <table class="tabla-goleadores">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Jugador</th>
                        <th>Goles</th>
                    </tr>
                </thead>
                <tbody>
                    ${filas}
                </tbody>
            </table>
        `;
    }

    lista.appendChild(bloque);
}

cargarPartidos();

<!DOCTYPE html>
<html lang="es">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    const SUPABASE_URL = "https://wsuibsilfwqdjqhuttfn.supabase.co";
    const SUPABASE_KEY = "sb_publishable_6JUNY6IGMqwt0BWd6eUyeg_wl58peJL";

    const supabaseClient = supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );
</script>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendario de fútbol</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            margin: 0;
            color: #1f2937;
        }

        header {
            background: #111827;
            color: white;
            text-align: center;
            padding: 30px 20px;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
        }

        header p {
            margin: 8px 0 0;
            opacity: 0.8;
        }

        main {
            max-width: 700px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .partido {
            background: white;
            border-radius: 16px;
            padding: 22px;
            margin-bottom: 20px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .jornada {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 10px;
        }

        .equipos {
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            margin: 15px 0;
        }

        .datos {
            text-align: center;
            line-height: 1.8;
            color: #4b5563;
        }

        .boton {
            display: block;
            width: 100%;
            margin-top: 18px;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: #111827;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<header>
<h1>⚽ EJEMPLO</h1>
<p>Temporada 2026/2027</p>
</header>

<main>

<main id="lista-partidos">

    <p style="text-align:center;">Cargando partidos...</p>

</main>
</main>
<script>
async function cargarPartidos() {

    const lista = document.getElementById("lista-partidos");

    const { data, error } = await supabaseClient
        .from("partidos")
        .select("*")
        .order("fecha", { ascending: true })
        .order("hora", { ascending: true });

    if (error) {
        console.error(error);
        lista.innerHTML = "<p style='text-align:center;'>No se han podido cargar los partidos.</p>";
        return;
    }

    if (!data || data.length === 0) {
        lista.innerHTML = "<p style='text-align:center;'>No hay partidos programados.</p>";
        return;
    }

    lista.innerHTML = "";

    data.forEach((partido, indice) => {

        const fecha = new Date(partido.fecha + "T00:00:00");

        const fechaFormateada = fecha.toLocaleDateString("es-ES", {
            weekday: "long",
            day: "numeric",
            month: "long"
        });

        const tarjeta = document.createElement("div");

        tarjeta.className = "partido";

        tarjeta.innerHTML = `
            <div class="jornada">
                Jornada ${indice + 1}
            </div>

            <div class="equipos">
                ${partido.local} 🆚 ${partido.visitante}
            </div>

            <div class="datos">
                📅 ${fechaFormateada}<br>
                🕘 ${partido.hora.slice(0, 5)}<br>
                📍 ${partido.campo || "Campo por confirmar"}
            </div>

            <button class="boton" onclick="alert('Aquí pondremos la disponibilidad')">
                ¿Puedes jugar?
            </button>
        `;

        lista.appendChild(tarjeta);
    });
}

cargarPartidos();
</script>
</body>
</html>

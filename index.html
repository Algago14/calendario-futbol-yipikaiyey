<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calendario de fútbol</title>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        const SUPABASE_URL = "https://wsuibsilfwqdjqhuttfn.supabase.co";
        const SUPABASE_KEY = "sb_publishable_6JUNY6IGMqwt0BWd6eUyeg_wl58peJL";

        const supabaseClient = supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );
    </script>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            margin: 0;
            color: #1f2937;
        }

        header {
            background: #111827;
            color: white;
            text-align: center;
            padding: 30px 20px;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
        }

        header p {
            margin: 8px 0 0;
            opacity: 0.8;
        }

        main {
            max-width: 700px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .partido {
            background: white;
            border-radius: 16px;
            padding: 22px;
            margin-bottom: 20px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .jornada {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 10px;
        }

        .equipos {
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            margin: 15px 0;
        }

        .datos {
            text-align: center;
            line-height: 1.8;
            color: #4b5563;
        }

        .boton {
            display: block;
            width: 100%;
            margin-top: 18px;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: #111827;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .boton:hover {
            background: #1f2937;
        }

    </style>

</head>

<body>

<header>

    <h1>⚽ EJEMPLO</h1>

    <p>Temporada 2026/2027</p>

</header>


<main id="lista-partidos">

    <p style="text-align:center;">
        Cargando partidos...
    </p>

</main>


<script>


/* =========================================================
   CARGAR PARTIDOS
   ========================================================= */

async function cargarPartidos() {

    const lista = document.getElementById("lista-partidos");

    const { data, error } = await supabaseClient
        .from("partidos")
        .select("*")
        .order("fecha", { ascending: true })
        .order("hora", { ascending: true });


    if (error) {

        console.error(error);

        lista.innerHTML = `
            <p style="text-align:center;">
                No se han podido cargar los partidos.
            </p>
        `;

        return;
    }


    if (!data || data.length === 0) {

        lista.innerHTML = `
            <p style="text-align:center;">
                No hay partidos programados.
            </p>
        `;

        return;
    }


    lista.innerHTML = "";


    data.forEach((partido, indice) => {

        const fecha = new Date(
            partido.fecha + "T00:00:00"
        );


        const fechaFormateada =
            fecha.toLocaleDateString("es-ES", {
                weekday: "long",
                day: "numeric",
                month: "long"
            });


        const tarjeta = document.createElement("div");

        tarjeta.className = "partido";


        tarjeta.innerHTML = `

            <div class="jornada">
                Jornada ${indice + 1}
            </div>

            <div class="equipos">
                ${partido.local} 🆚 ${partido.visitante}
            </div>

            <div class="datos">

                📅 ${fechaFormateada}<br>

                🕘 ${partido.hora.slice(0, 5)}<br>

                📍 ${partido.campo || "Campo por confirmar"}

            </div>


            <button
                class="boton"
                onclick="mostrarDisponibilidad(${partido.id})"
            >
                ¿Puedes jugar?
            </button>

        `;


        lista.appendChild(tarjeta);

    });

}



/* =========================================================
   MOSTRAR VENTANA DE DISPONIBILIDAD
   ========================================================= */

async function mostrarDisponibilidad(partidoId) {


    /* Obtener jugadores */

    const { data: jugadores, error } = await supabaseClient

        .from("jugadores")

        .select("id, nombre")

        .order("nombre", {
            ascending: true
        });


    if (error) {

        console.error(error);

        alert(
            "No se han podido cargar los jugadores."
        );

        return;
    }


    if (!jugadores || jugadores.length === 0) {

        alert(
            "Todavía no hay jugadores registrados."
        );

        return;
    }


    /* Crear opciones */

    const opciones = jugadores
        .map(jugador => `

            <option value="${jugador.id}">
                ${jugador.nombre}
            </option>

        `)
        .join("");


    /* Crear ventana */

    const ventana =
        document.createElement("div");


    ventana.innerHTML = `

        <div style="

            position: fixed;
            inset: 0;

            background: rgba(0,0,0,0.5);

            display: flex;

            align-items: center;
            justify-content: center;

            padding: 20px;

            z-index: 9999;

        ">


            <div style="

                background: white;

                width: 100%;
                max-width: 400px;

                border-radius: 16px;

                padding: 25px;

                box-sizing: border-box;

            ">


                <h2 style="
                    margin-top:0;
                ">

                    ¿Puedes jugar?

                </h2>


                <label for="jugador-select">

                    ¿Quién eres?

                </label>


                <select
                    id="jugador-select"
                    style="

                        width:100%;

                        padding:12px;

                        margin-top:8px;
                        margin-bottom:20px;

                        border-radius:8px;

                        border:1px solid #d1d5db;

                        font-size:16px;

                    "
                >

                    <option value="">

                        Selecciona tu nombre

                    </option>

                    ${opciones}

                </select>


                <div style="

                    display:flex;

                    gap:10px;

                    flex-direction:column;

                ">


                    <button
                        id="respuesta-si"
                        style="

                            padding:13px;

                            border:none;

                            border-radius:10px;

                            background:#16a34a;

                            color:white;

                            font-size:16px;

                            cursor:pointer;

                        "
                    >

                        🟢 Sí, puedo

                    </button>


                    <button
                        id="respuesta-no"
                        style="

                            padding:13px;

                            border:none;

                            border-radius:10px;

                            background:#dc2626;

                            color:white;

                            font-size:16px;

                            cursor:pointer;

                        "
                    >

                        🔴 No puedo

                    </button>


                    <button
                        id="respuesta-duda"
                        style="

                            padding:13px;

                            border:none;

                            border-radius:10px;

                            background:#d97706;

                            color:white;

                            font-size:16px;

                            cursor:pointer;

                        "
                    >

                        🟡 Tengo dudas

                    </button>


                    <button
                        id="cerrar-ventana"
                        style="

                            padding:10px;

                            border:none;

                            background:transparent;

                            color:#6b7280;

                            cursor:pointer;

                        "
                    >

                        Cancelar

                    </button>


                </div>

            </div>

        </div>

    `;


    document.body.appendChild(ventana);


    /* Botón cancelar */

    document
        .getElementById("cerrar-ventana")
        .onclick = () => {

            ventana.remove();

        };


    /* Botón Sí */

    document
        .getElementById("respuesta-si")
        .onclick = () => {

            enviarRespuesta("si");

        };


    /* Botón No */

    document
        .getElementById("respuesta-no")
        .onclick = () => {

            enviarRespuesta("no");

        };


    /* Botón Duda */

    document
        .getElementById("respuesta-duda")
        .onclick = () => {

            enviarRespuesta("duda");

        };


    /* Guardar respuesta */

    async function enviarRespuesta(estado) {


        const jugadorId =
            document.getElementById(
                "jugador-select"
            ).value;


        if (!jugadorId) {

            alert(
                "Primero selecciona tu nombre."
            );

            return;
        }


        await guardarDisponibilidad(
            partidoId,
            jugadorId,
            estado
        );


        ventana.remove();

    }

}



/* =========================================================
   GUARDAR / ACTUALIZAR DISPONIBILIDAD
   ========================================================= */

async function guardarDisponibilidad(
    partidoId,
    jugadorId,
    estado
) {


    const { error } = await supabaseClient

        .from("disponibilidad")

        .upsert(

            {
                partido_id: partidoId,

                jugador_id: jugadorId,

                estado: estado,

                actualizado_en:
                    new Date().toISOString()
            },

            {
                onConflict:
                    "partido_id,jugador_id"
            }

        );


    if (error) {

        console.error(error);

        alert(
            "No se ha podido guardar tu respuesta."
        );

        return;
    }


    alert(
        "✅ Tu disponibilidad se ha guardado."
    );

}



/* =========================================================
   INICIAR
   ========================================================= */

cargarPartidos();


</script>

</body>

</html>
</script>

</body>
</html>

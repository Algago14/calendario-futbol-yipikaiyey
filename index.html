    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>

        const SUPABASE_URL = "https://wsuibsilfwqdjqhuttfn.supabase.co";
        const SUPABASE_KEY = "sb_publishable_6JUNY6IGMqwt0BWd6eUyeg_wl58peJL";

        const supabaseClient = supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );

    </script>


    <style>

        body {
            font-family: Arial, sans-serif;
            background: white;
            margin: 0;
            color: #1f2937;
        }


        header {
            background: white;
            color: #1646a0;
            text-align: center;
            padding: 30px 20px;
            border-bottom: 1px solid #e5e7eb;
        }


        .escudo {
            width: 150px;
            height: 150px;
            object-fit: contain;
            display: block;
            margin: 0 auto 15px;
        }


        header h1 {
            margin: 0;
            font-size: 28px;
            color: #1646a0;
        }


        header p {
            margin: 8px 0 0;
            color: #1646a0;
            opacity: 0.8;
        }


        main {
            max-width: 700px;
            margin: 30px auto;
            padding: 0 20px;
        }


        .partido {
            background: white;
            border-radius: 16px;
            padding: 22px;
            margin-bottom: 20px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }


        .jornada {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 10px;
        }


        .equipos {
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            margin: 15px 0;
        }


        .datos {
            text-align: center;
            line-height: 1.8;
            color: #4b5563;
        }


        .boton {
            display: block;
            width: 100%;
            margin-top: 18px;
            padding: 13px;
            border: none;

            font-size: 16px;
            cursor: pointer;
        }


        .boton:hover {
            background: #1f2937;
        }


        /* Disponibilidad */

        .disponibilidad {
            margin-top: 22px;
            border-top: 1px solid #e5e7eb;
            padding-top: 18px;
        }


        .estado {
            margin-bottom: 12px;
            font-size: 15px;
            line-height: 1.5;
        }


        .estado-titulo {
            font-weight: bold;
        }


        .nombres {
            color: #4b5563;
            margin-top: 3px;
            padding-left: 22px;
        }


        .sin-respuestas {
            color: #9ca3af;
            font-size: 14px;
            text-align: center;
        }

    </style>

</head>


<body>


<header>

    <img
        class="escudo"
        src="escudo.jpg"
        alt="Escudo YIPIKAIYEY FS"
    >

    <h1>CALENDARIO YIPIKAIYEY</h1>

    <p>Temporada 2026/2027</p>

</header>


<main id="lista-partidos">

    <p style="text-align:center;">
        Cargando partidos...
    </p>

</main>


<script>


/* =========================================================
   CARGAR PARTIDOS
   ========================================================= */

async function cargarPartidos() {

    const lista =
        document.getElementById("lista-partidos");


    /* Obtener partidos */

    const { data: partidos, error } =
        await supabaseClient

            .from("partidos")

            .select("*")

            .order("fecha", {
                ascending: true
            })

            .order("hora", {
                ascending: true
            });


    if (error) {

        console.error(error);

        lista.innerHTML = `
            <p style="text-align:center;">
                No se han podido cargar los partidos.
            </p>
        `;

        return;
    }


    if (!partidos || partidos.length === 0) {

        lista.innerHTML = `
            <p style="text-align:center;">
                No hay partidos programados.
            </p>
        `;

        return;
    }


    /* Obtener todas las disponibilidades */

    const {
        data: disponibilidades,
        error: errorDisponibilidad
    } = await supabaseClient

        .from("disponibilidad")

        .select(`
            partido_id,
            jugador_id,
            estado,
            jugadores (
                nombre
            )
        `);


    if (errorDisponibilidad) {

        console.error(errorDisponibilidad);

    }


    const respuestas =
        disponibilidades || [];


    lista.innerHTML = "";


    /* Crear cada partido */

    partidos.forEach((partido, indice) => {


        const fecha =
            new Date(
                partido.fecha + "T00:00:00"
            );


        const fechaFormateada =
            fecha.toLocaleDateString(
                "es-ES",
                {
                    weekday: "long",
                    day: "numeric",
                    month: "long"
                }
            );


        /* Filtrar respuestas de este partido */

        const respuestasPartido =
            respuestas.filter(
                respuesta =>
                    respuesta.partido_id === partido.id
            );


        /* Separar por estado */

        const disponibles =
            respuestasPartido.filter(
                respuesta =>
                    respuesta.estado === "si"
            );


        const noDisponibles =
            respuestasPartido.filter(
                respuesta =>
                    respuesta.estado === "no"
            );


        const dudas =
            respuestasPartido.filter(
                respuesta =>
                    respuesta.estado === "duda"
            );


        /* Obtener nombres */

        const nombresSi =
            disponibles
                .map(
                    respuesta =>
                        respuesta.jugadores?.nombre
                )
                .filter(Boolean);


        const nombresNo =
            noDisponibles
                .map(
                    respuesta =>
                        respuesta.jugadores?.nombre
                )
                .filter(Boolean);


        const nombresDuda =
            dudas
                .map(
                    respuesta =>
                        respuesta.jugadores?.nombre
                )
                .filter(Boolean);


        /* Crear tarjeta */

        const tarjeta =
            document.createElement("div");


        tarjeta.className = "partido";


        tarjeta.innerHTML = `

            <div class="jornada">
                Jornada ${indice + 1}
            </div>


            <div class="equipos">
                ${partido.local} 🆚 ${partido.visitante}
            </div>


            <div class="datos">

                📅 ${fechaFormateada}<br>

                🕘 ${partido.hora.slice(0, 5)}<br>

                📍 ${partido.campo || "Campo por confirmar"}

            </div>


            <div class="disponibilidad">


                <div class="estado">

                    <div class="estado-titulo">

                        🟢 Sí:
                        ${nombresSi.length}

                    </div>

                    <div class="nombres">

                        ${
                            nombresSi.length
                                ? nombresSi.join(", ")
                                : "Nadie ha confirmado todavía"
                        }

                    </div>

                </div>


                <div class="estado">

                    <div class="estado-titulo">

                        🔴 No:
                        ${nombresNo.length}

                    </div>

                    <div class="nombres">

                        ${
                            nombresNo.length
                                ? nombresNo.join(", ")
                                : "Nadie ha indicado que no pueda"
                        }

                    </div>

                </div>


                <div class="estado">

                    <div class="estado-titulo">

                        🟡 Duda:
                        ${nombresDuda.length}

                    </div>

                    <div class="nombres">

                        ${
                            nombresDuda.length
                                ? nombresDuda.join(", ")
                                : "Nadie tiene dudas"
                        }

                    </div>

                </div>


            </div>


            <button
                class="boton"
                onclick="mostrarDisponibilidad(${partido.id})"
            >

                ¿Puedes jugar?

            </button>

        `;


        lista.appendChild(tarjeta);

    });

}



/* =========================================================
   MOSTRAR VENTANA DE DISPONIBILIDAD
   ========================================================= */

async function mostrarDisponibilidad(partidoId) {


    const {
        data: jugadores,
        error
    } = await supabaseClient

        .from("jugadores")

        .select("id, nombre")

        .order("nombre", {
            ascending: true
        });


    if (error) {

        console.error(error);

        alert(
            "No se han podido cargar los jugadores."
        );

        return;
    }


    if (!jugadores || jugadores.length === 0) {

        alert(
            "Todavía no hay jugadores registrados."
        );

        return;
    }


    const opciones =
        jugadores

            .map(
                jugador => `

                    <option value="${jugador.id}">
                        ${jugador.nombre}
                    </option>

                `
            )

            .join("");


    const ventana =
        document.createElement("div");


    ventana.innerHTML = `

        <div style="

            position: fixed;
            inset: 0;

            background: rgba(0,0,0,0.5);

            display: flex;

            align-items: center;
            justify-content: center;

            padding: 20px;

            z-index: 9999;

        ">


            <div style="

                background: white;

                width: 100%;
                max-width: 400px;

                border-radius: 16px;

                padding: 25px;

                box-sizing: border-box;

            ">


                <h2 style="margin-top:0;">

                    ¿Puedes jugar?

                </h2>


                <label for="jugador-select">

                    ¿Quién eres?

                </label>


                <select
                    id="jugador-select"
                    style="

                        width:100%;

                        padding:12px;

                        margin-top:8px;

                        margin-bottom:20px;

                        border-radius:8px;

                        border:1px solid #d1d5db;

                        font-size:16px;

                    "
                >

                    <option value="">

                        Selecciona tu nombre

                    </option>

                    ${opciones}

                </select>


                <div style="

                    display:flex;

                    gap:10px;

                    flex-direction:column;

                ">


                    <button
                        id="respuesta-si"
                        style="

                            padding:13px;

                            border:none;

                            border-radius:10px;

                            background:#16a34a;

                            color:white;

                            font-size:16px;

                            cursor:pointer;

                        "
                    >

                        🟢 Sí, puedo

                    </button>


                    <button
                        id="respuesta-no"
                        style="

                            padding:13px;

                            border:none;

                            border-radius:10px;

                            background:#dc2626;

                            color:white;

                            font-size:16px;

                            cursor:pointer;

                        "
                    >

                        🔴 No puedo

                    </button>


                    <button
                        id="respuesta-duda"
                        style="

                            padding:13px;

                            border:none;

                            border-radius:10px;

                            background:#d97706;

                            color:white;

                            font-size:16px;

                            cursor:pointer;

                        "
                    >

                        🟡 Tengo dudas

                    </button>


                    <button
                        id="cerrar-ventana"
                        style="

                            padding:10px;

                            border:none;

                            background:transparent;

                            color:#6b7280;

                            cursor:pointer;

                        "
                    >

                        Cancelar

                    </button>


                </div>

            </div>

        </div>

    `;


    document.body.appendChild(ventana);


    /* Cancelar */

    document
        .getElementById("cerrar-ventana")
        .onclick = () => {

            ventana.remove();

        };


    /* Sí */

    document
        .getElementById("respuesta-si")
        .onclick = () => {

            enviarRespuesta("si");

        };


    /* No */

    document
        .getElementById("respuesta-no")
        .onclick = () => {

            enviarRespuesta("no");

        };


    /* Duda */

    document
        .getElementById("respuesta-duda")
        .onclick = () => {

            enviarRespuesta("duda");

        };


    /* Guardar */

    async function enviarRespuesta(estado) {


        const jugadorId =
            document.getElementById(
                "jugador-select"
            ).value;


        if (!jugadorId) {

            alert(
                "Primero selecciona tu nombre."
            );

            return;
        }


        const guardado =
            await guardarDisponibilidad(
                partidoId,
                jugadorId,
                estado
            );


        if (guardado) {

            ventana.remove();

            /* Actualizar inmediatamente */

            await cargarPartidos();

        }

    }

}



/* =========================================================
   GUARDAR / ACTUALIZAR DISPONIBILIDAD
   ========================================================= */

async function guardarDisponibilidad(
    partidoId,
    jugadorId,
    estado
) {


    const {
        error
    } = await supabaseClient

        .from("disponibilidad")

        .upsert(

            {
                partido_id: partidoId,

                jugador_id: jugadorId,

                estado: estado,

                actualizado_en:
                    new Date().toISOString()
            },

            {
                onConflict:
                    "partido_id,jugador_id"
            }

        );


    if (error) {

        console.error(error);

        alert(
            "No se ha podido guardar tu respuesta."
        );

        return false;
    }


    return true;

}



/* =========================================================
   INICIAR
   ========================================================= */

cargarPartidos();


</script>

</body>

</html>
